<div class="offcanvas offcanvas-end show" tabindex="-1" style="visibility: visible; width: 420px;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Create Role</h5>
    <button type="button" class="btn-close text-reset" (click)="close.emit()"></button>
  </div>

  <div class="offcanvas-body">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Key</label>
        <input class="form-control" formControlName="key" placeholder="e.g. web-manager" />
        <div class="text-danger mt-1" *ngIf="t('key') && form.controls.key.errors?.['required']">Key is required.</div>
        <div class="text-danger mt-1" *ngIf="t('key') && form.controls.key.errors?.['pattern']">
          Use lowercase letters, digits and hyphens (e.g. <code>web-manager</code>).
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" formControlName="name" placeholder="e.g. Web Manager" />
        <div class="text-danger mt-1" *ngIf="t('name') && form.controls.name.errors?.['required']">Name is required.</div>
      </div>

      <div class="form-check mb-3">
        <input id="is_admin" type="checkbox" class="form-check-input" formControlName="is_admin" />
        <label class="form-check-label" for="is_admin">Is admin role?</label>
      </div>

      <div class="mb-2 d-flex align-items-center justify-content-between">
        <label class="form-label mb-0">Permissions</label>
        <input type="text" class="form-control" (input)="onSearch($event)" placeholder="Search…" style="max-width: 220px;" />
      </div>
      <div class="border rounded p-2" style="max-height: 260px; overflow: auto;">
        <div class="form-check" *ngFor="let p of filteredPerms()">
          <input class="form-check-input" type="checkbox"
                 [id]="'perm_'+p.id"
                 [checked]="selectedKeys().has(p.key)"
                 (change)="toggleKey(p.key, $event)" />
          <label class="form-check-label" [for]="'perm_'+p.id">
            <code>{{ p.key }}</code> — {{ p.name }}
          </label>
        </div>
        <div class="text-muted" *ngIf="!filteredPerms().length">No permissions.</div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="close.emit()">Cancel</button>
        <button class="btn btn-primary" [disabled]="saving()">Create</button>
      </div>
    </form>
  </div>
</div>
