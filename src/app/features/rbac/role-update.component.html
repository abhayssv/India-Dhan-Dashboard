<div class="offcanvas offcanvas-end show" tabindex="-1" style="visibility: visible; width: 420px;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Update Role</h5>
    <button type="button" class="btn-close text-reset" (click)="close.emit()"></button>
  </div>

  <div class="offcanvas-body" *ngIf="loaded(); else loadingTpl">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Key</label>
        <input class="form-control" [value]="role.key" readonly />
        <small class="text-muted">Key cannot be changed.</small>
      </div>

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" formControlName="name" />
        <div class="text-danger mt-1" *ngIf="t('name')">Name is required.</div>
      </div>

      <div class="form-check mb-3">
        <input id="is_admin_u" type="checkbox" class="form-check-input" formControlName="is_admin" />
        <label class="form-check-label" for="is_admin_u">Is admin role?</label>
      </div>

      <div class="mb-2 d-flex align-items-center justify-content-between">
        <label class="form-label mb-0">Permissions</label>
        <input type="text" class="form-control" (input)="onSearch($event)" placeholder="Search…" style="max-width: 220px;" />
      </div>
      <div class="border rounded p-2" style="max-height: 260px; overflow: auto;">
        <div class="form-check" *ngFor="let p of filteredPerms()">
          <input class="form-check-input" type="checkbox"
                 [id]="'perm_u_'+p.id"
                 [checked]="selectedKeys().has(p.key)"
                 (change)="toggleKey(p.key, $event)" />
          <label class="form-check-label" [for]="'perm_u_'+p.id">
            <code>{{ p.key }}</code> — {{ p.name }}
          </label>
        </div>
        <div class="text-muted" *ngIf="!filteredPerms().length">No permissions.</div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="close.emit()">Cancel</button>
        <button class="btn btn-primary" [disabled]="saving()">Update</button>
      </div>
    </form>
  </div>
  <ng-template #loadingTpl>
    <div class="text-center py-5">Loading…</div>
  </ng-template>
</div>
