<div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Pro Referral</h5>
          <button type="button" class="btn-close" (click)="close.emit()"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete <strong>{{ referral?.referral_code }}</strong>?</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" (click)="close.emit()" [disabled]="deleting()">Cancel</button>
          <button class="btn btn-danger" (click)="remove()" [disabled]="deleting()">
            <ng-container *ngIf="!deleting(); else delTpl">Delete</ng-container>
          </button>
          <ng-template #delTpl>Deleting…</ng-template>
        </div>
      </div>
    </div>
  </div>
